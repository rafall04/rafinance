; Setelan PHP produksi Rafin.

; Galat masuk log, tidak pernah ke layar. Satu stack trace yang bocor ke
; halaman bisa memuat isi $_ENV, dan di sana ada kata sandi database.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL & ~E_DEPRECATED

expose_php = Off

memory_limit = 256M
max_execution_time = 60

; Batas unggahan sengaja di bawah client_max_body_size nginx, supaya yang
; menolak berkas kebesaran adalah PHP dengan pesan yang bisa ditangani
; aplikasi, bukan nginx dengan 413 mentah.
upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 8

date.timezone = UTC

; OPcache. Kode tidak pernah berubah di dalam image, jadi tidak ada gunanya
; memeriksa timestamp berkas di setiap request.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1
opcache.fast_shutdown = 1

; Sesi ditangani Laravel lewat Redis; handler bawaan PHP tidak dipakai.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = "Lax"

realpath_cache_size = 4096k
realpath_cache_ttl = 600
