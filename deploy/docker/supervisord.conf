; supervisord menyatukan nginx dan php-fpm dalam satu kontainer.
;
; Kalau salah satu mati, kontainernya ikut mati (autorestart=false pada
; keduanya) sehingga Docker yang memulai ulang seluruhnya. Membiarkan
; supervisord menghidupkan ulang satu proses diam-diam akan menyembunyikan
; kontainer yang sebenarnya sakit dari healthcheck.

[supervisord]
nodaemon = true
user = root
logfile = /dev/null
logfile_maxbytes = 0
pidfile = /tmp/supervisord.pid

[program:php-fpm]
command = php-fpm --nodaemonize
autostart = true
autorestart = false
startretries = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
; php-fpm harus siap sebelum nginx mulai meneruskan request ke sana.
priority = 10

[program:nginx]
command = nginx -g "daemon off;"
autostart = true
autorestart = false
startretries = 0
stdout_logfile = /dev/stdout
stdout_logfile_maxbytes = 0
stderr_logfile = /dev/stderr
stderr_logfile_maxbytes = 0
priority = 20

[eventlistener:mati]
; Satu proses tumbang berarti kontainer tumbang. Docker yang memutuskan
; apa yang terjadi berikutnya, bukan supervisord.
command = sh -c "printf 'READY\n'; while read -r baris; do kill -SIGQUIT $PPID; done"
events = PROCESS_STATE_FATAL,PROCESS_STATE_EXITED
