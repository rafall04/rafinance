; Pool php-fpm Rafin.
;
; Kotak ini sudah berjalan di sekitar 74% dari delapan core, dipakai
; deteksi gerak CCTV. Rafin masih beta dengan lalu lintas kecil, jadi
; pool-nya sengaja dibatasi: lebih baik antre sebentar daripada ikut
; menekan mesin yang sedang menanggung pekerjaan orang lain.

[www]
user = www-data
group = www-data

listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 5

; Daur ulang worker berkala. Kebocoran memori kecil di pustaka mana pun
; jadi tidak pernah menumpuk sampai kehabisan.
pm.max_requests = 500

; Request yang menggantung lebih dari satu menit dicatat lengkap dengan
; stack trace-nya, lalu dimatikan.
request_terminate_timeout = 75s
request_slowlog_timeout = 15s
slowlog = /dev/stderr

catch_workers_output = yes
decorate_workers_output = no

clear_env = no

; Status pool hanya lewat loopback di dalam kontainer.
pm.status_path = /fpm-status
