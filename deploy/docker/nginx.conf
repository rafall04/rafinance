# nginx di dalam kontainer Rafin.
#
# Ia hanya berbicara HTTP polos di port 80 dan tidak pernah terlihat dari
# luar mesin: compose hanya memetakannya ke 127.0.0.1. TLS diterminasi
# Cloudflare, jauh di depan.

user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Log ke stdout supaya `docker logs` jadi satu-satunya tempat melihat.
    log_format ringkas '$remote_addr $http_x_forwarded_for "$request" '
                       '$status $body_bytes_sent ${request_time}s';
    access_log /dev/stdout ringkas;

    sendfile      on;
    tcp_nopush    on;
    server_tokens off;

    keepalive_timeout 30;
    client_max_body_size 12m;   # lampiran struk, sedikit di atas batas aplikasi

    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript
                      application/manifest+json text/xml application/xml image/svg+xml;

    # Direktori sementara di /tmp: kontainer berjalan sebagai www-data dan
    # tidak boleh menulis ke /var/lib/nginx.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    server {
        listen 80 default_server;
        server_name _;
        root /var/www/html/public;
        index index.php;

        charset utf-8;

        # Aset ber-hash dari Vite: namanya berubah setiap kali isinya
        # berubah, jadi aman disimpan selamanya. Ini yang membuat kunjungan
        # kedua nyaris tanpa unduhan — penting untuk kuota data yang tipis.
        location /build/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Service worker tidak boleh di-cache: kalau versi lama menempel,
        # pengguna terjebak di aplikasi lama sampai cache-nya kedaluwarsa.
        location = /sw.js {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri =404;
        }

        location = /manifest.webmanifest {
            add_header Cache-Control "no-cache";
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ ^/index\.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param DOCUMENT_ROOT   $document_root;
            fastcgi_hide_header X-Powered-By;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Hanya index.php yang boleh dieksekusi. Tanpa aturan ini, berkas
        # .php apa pun yang entah bagaimana mendarat di public/ — lampiran
        # yang salah tempat, sisa alat — bisa dijalankan.
        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}
