# Vhost nginx untuk Rafin.
#
#   /etc/nginx/sites-available/rafin  →  symlink ke sites-enabled/
#
# Ganti PLACEHOLDER berikut sesuai hasil port-audit.sh:
#   __PORT__        port HTTP yang bebas (mis. 8090)
#   __SERVER_NAME__ domain, mis. rafin.example.id
#
# Webhook Telegram MEWAJIBKAN HTTPS dengan sertifikat tepercaya.
# Kalau server ini di belakang reverse proxy/LB yang meng-terminate TLS,
# biarkan blok listen di bawah sebagai HTTP dan pastikan proxy meneruskan
# X-Forwarded-Proto — Laravel butuh itu untuk membangun URL https.

server {
    listen      __PORT__;
    listen      [::]:__PORT__;
    server_name __SERVER_NAME__;

    root  /var/www/rafin/current/public;
    index index.php;

    charset utf-8;

    # Batas upload: lampiran struk. Selaraskan dengan php.ini
    # (upload_max_filesize & post_max_size).
    client_max_body_size 12M;

    # ── Keamanan header ────────────────────────────────────────────────
    add_header X-Frame-Options            "SAMEORIGIN"        always;
    add_header X-Content-Type-Options     "nosniff"           always;
    add_header Referrer-Policy            "same-origin"       always;
    add_header X-Permitted-Cross-Domain-Policies "none"       always;

    # ── Health check (route /up bawaan Laravel, lihat bootstrap/app.php) ─
    location = /up {
        try_files $uri /index.php?$query_string;
        access_log off;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # ── Aset ter-build Vite: hashed filename, aman di-cache selamanya ───
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── Service worker: JANGAN di-cache, kalau tidak PWA tidak pernah
    #    memperbarui dirinya ────────────────────────────────────────────
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass  unix:/run/php/php8.3-fpm-rafin.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT   $realpath_root;
        include       fastcgi_params;

        # Impor CSV dan ekspor laporan bisa memakan waktu.
        fastcgi_read_timeout 120s;
        fastcgi_hide_header X-Powered-By;
    }

    # Lampiran ada di disk privat tanpa URL (aturan A11) — tidak ada
    # location untuk /storage. Jangan tambahkan.

    # Tolak akses ke dotfile dan file sensitif.
    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(env|log|sql|md|lock|json)$ {
        deny all;
        return 404;
    }

    access_log /var/log/nginx/rafin-access.log;
    error_log  /var/log/nginx/rafin-error.log;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json;
}
