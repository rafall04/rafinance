# Susunan produksi Rafin.
#
# ALOKASI PORT — mesin ini menjalankan lebih dari dua puluh kontainer lain
# ditambah aaPanel, MySQL, mediamtx, dan sederet layanan Node. Karena itu
# Rafin memakai tepat satu port di host:
#
#     127.0.0.1:3400  → aplikasi web
#
# PostgreSQL dan Redis TIDAK dipublikasikan sama sekali. Keduanya hanya bisa
# dijangkau dari jaringan compose ini. Itu bukan sekadar kerapian: ufw tidak
# menyaring port yang dipublikasikan Docker — Docker menyisipkan aturan DNAT
# sebelum rantai ufw, sehingga `ports: 5432:5432` akan membuat database
# terbuka ke seluruh LAN meskipun firewall-nya menutup. Beberapa proyek lain
# di kotak ini memang terlanjur begitu.
#
# Pengikatan ke 127.0.0.1 juga yang membuat 3400 aman: hanya nginx lokal
# yang bisa menjangkaunya, dan nginx hanya menerima dari cloudflared.

name: rafin

x-app: &app
  build:
    context: ../
    dockerfile: deploy/docker/Dockerfile
  image: rafin-app:latest
  env_file: [.env]
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    redis:    {condition: service_healthy}
  volumes:
    # Lampiran (aturan A11) dan log harus bertahan lintas rilis.
    - storage:/var/www/html/storage
  networks: [internal]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      # Superuser hanya dipakai saat init. Aplikasi tidak pernah memakainya.
      POSTGRES_USER: ${DB_SUPER_USERNAME}
      POSTGRES_PASSWORD: ${DB_SUPER_PASSWORD}
      RAFIN_APP_PASSWORD: ${DB_PASSWORD}
      RAFIN_OWNER_PASSWORD: ${DB_MIGRATE_PASSWORD}
      # Locale Indonesia untuk pengurutan teks.
      LANG: id_ID.utf8
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Skrip init hanya berjalan saat volume masih kosong.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [internal]
    deploy:
      resources:
        limits: {memory: 768M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 192mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --appendonly no
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [internal]
    deploy:
      resources:
        limits: {memory: 256M}
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  # ── Web ──────────────────────────────────────────────────────────────
  web:
    <<: *app
    container_name: rafin-web
    environment:
      # Hanya layanan ini yang menjalankan migration. Kalau ketiganya
      # menyala bersamaan dan semuanya bermigrasi, keduanya berebut kunci
      # dan salah satu gagal di tengah.
      RAFIN_MIGRATE: "1"
    ports:
      - "127.0.0.1:3400:80"
    deploy:
      resources:
        limits: {memory: 512M, cpus: "1.5"}

  # ── Antrean ──────────────────────────────────────────────────────────
  queue:
    <<: *app
    container_name: rafin-queue
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      web:      {condition: service_healthy}
    command:
      - php
      - artisan
      - queue:work
      - --queue=high,default,low
      - --tries=3
      - --backoff=5,30,120
      - --max-time=3600
      - --max-jobs=500
      - --sleep=2
      - --rest=0.2
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'queue:work' >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 384M, cpus: "0.75"}

  # ── Penjadwal ────────────────────────────────────────────────────────
  scheduler:
    <<: *app
    container_name: rafin-scheduler
    depends_on:
      postgres: {condition: service_healthy}
      redis:    {condition: service_healthy}
      web:      {condition: service_healthy}
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'schedule:work' >/dev/null || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: {memory: 256M, cpus: "0.5"}

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  internal:
    driver: bridge
