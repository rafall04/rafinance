# rafinance.raf.my.id — vhost host untuk Rafin.
#
# Dipasang di nginx bawaan Ubuntu (/usr/sbin/nginx, sites-available/),
# BUKAN di nginx milik aaPanel. aaPanel menulis ulang konfigurasinya
# sendiri dan akan menghapus berkas ini pada perubahan berikutnya.
#
#   ln -s /etc/nginx/sites-available/rafinance.raf.my.id \
#         /etc/nginx/sites-enabled/rafinance.raf.my.id
#   nginx -t && systemctl reload nginx
#
# Rantainya:
#   peramban → Cloudflare (TLS berhenti di sini)
#            → cloudflared (lokal)
#            → vhost ini, 127.0.0.1:8095
#            → kontainer Rafin, 127.0.0.1:3400
#
# Ingress cloudflared diatur di dasbor Cloudflare:
#   rafinance.raf.my.id → http://localhost:8095

server {
    # Loopback saja. Tidak bisa dijangkau dari LAN maupun internet —
    # satu-satunya yang bisa menyentuhnya adalah cloudflared di mesin ini.
    listen 127.0.0.1:8095;
    server_name rafinance.raf.my.id;

    # Sedikit di atas batas PHP (10M) supaya yang menolak unggahan
    # kebesaran adalah aplikasi, dengan pesan berbahasa Indonesia, bukan
    # nginx dengan 413 mentah yang tidak menjelaskan apa-apa.
    client_max_body_size 12m;

    # Service worker. Harus berada DI ATAS location /build/ dalam berkas ini
    # agar mudah dibaca berpasangan, meski nginx memang sudah mendahulukan
    # pencocokan '=' apa pun urutannya.
    #
    # Alamatnya /build/sw.js, bukan /sw.js — berkasnya memang di sana, dan
    # daftar precache-nya memakai URL relatif yang hanya benar dari dalam
    # /build/. Aturan lama menunjuk /sw.js yang tidak pernah ada, sehingga
    # service worker justru mewarisi Cache-Control immutable setahun dari
    # blok /build/ di bawah.
    #
    # Service-Worker-Allowed diteruskan apa adanya dari kontainer; ia yang
    # mengizinkan skrip di /build/ mengendalikan seluruh situs. Tanpa itu
    # peramban menolak pendaftaran dengan SecurityError.
    location = /build/sw.js {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /build/manifest.webmanifest {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache";
    }

    # Aset ber-hash dari Vite. Nama berkasnya berubah setiap kali isinya
    # berubah, jadi aman disimpan selamanya. Ini yang membuat kunjungan
    # kedua nyaris tanpa unduhan — penting untuk kuota data yang tipis
    # dan sinyal yang naik-turun.
    location /build/ {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3400;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  443;

        # Skema publiknya https, diterminasi Cloudflare. Aplikasi harus
        # tahu itu: tautan bertanda tangan untuk lampiran (aturan A11)
        # ikut menandatangani skemanya, dan cookie sesi ditandai Secure.
        proxy_set_header X-Forwarded-Proto https;

        # Livewire kadang mengunggah lampiran dalam satu request panjang.
        proxy_read_timeout    120s;
        proxy_send_timeout    120s;
        proxy_connect_timeout 10s;

        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 32k;
    }

    access_log /var/log/nginx/rafin-access.log;
    error_log  /var/log/nginx/rafin-error.log warn;
}
